/******************************************************************************/
/* QSPI Download.INI: QSPI Download Initialization File                       */
/******************************************************************************/

/* Board index */
DEFINE int board;

FUNC void SetupQspiHardware(unsigned int index) {
    /* GPIO register write enable */
    _WWORD(0x40053BFC, 0xA501); /* CM_GPIO->PWPR = 0xA501U */
    /* GPIO read cycle 3 */
    _WWORD(0x40053BF8, 0x3000); /* CM_GPIO->PCCR = 0x3000U */

    /* ev_hc32f448_lqfp80_qspi */
    if (0 == index) {
        /* gpio pins setting high driver */
        _WWORD(0x40053C9C, 0x0020); /* CM_GPIO->PCRC7  = 0x0020U */
        _WWORD(0x40053C78, 0x0020); /* CM_GPIO->PCRB14 = 0x0020U */
        _WWORD(0x40053C74, 0x0020); /* CM_GPIO->PCRB13 = 0x0020U */
        _WWORD(0x40053CE4, 0x0020); /* CM_GPIO->PCRD9  = 0x0020U */
        _WWORD(0x40053CE8, 0x0020); /* CM_GPIO->PCRD10 = 0x0020U */
        _WWORD(0x40053CEC, 0x0020); /* CM_GPIO->PCRD11 = 0x0020U */

        /* gpio pins setting function */
        _WWORD(0x40053C9E, 0x0007); /* CM_GPIO->PFSRC7  = 0x0007U  */
        _WWORD(0x40053C7A, 0x0007); /* CM_GPIO->PFSRB14 = 0x0007U   */
        _WWORD(0x40053C76, 0x0007); /* CM_GPIO->PFSRB13 = 0x0007U */
        _WWORD(0x40053CE6, 0x0007); /* CM_GPIO->PFSRD9  = 0x0007U */
        _WWORD(0x40053CEA, 0x0007); /* CM_GPIO->PFSRD10 = 0x0007U */
        _WWORD(0x40053CEE, 0x0007); /* CM_GPIO->PFSRD11 = 0x0007U */
    } else {
        ;
    }
}

FUNC void ExecUserFlashInit(void) {
    board = 0;
    SetupQspiHardware(board);
}
